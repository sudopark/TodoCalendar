name: Test

on:
  pull_request:
    branches: ['**']

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      schemes: ${{ steps.map.outputs.schemes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only --no-renames origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$FILES"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify scheme derivation tables
        run: bash scripts/derive-test-schemes.test.sh

      - name: Map changes to test schemes
        id: map
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          schemes=$(printf '%s\n' "$FILES" | python3 scripts/derive-test-schemes.py --changed | tr '\n' ' ' | sed 's/ $//')
          echo "schemes=${schemes}" >> "$GITHUB_OUTPUT"
          echo "Detected schemes: ${schemes:-none}"

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.schemes != ''
    runs-on: Maggie-m1
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Ensure test simulator
        run: |
          set -euo pipefail
          udid="$(scripts/ensure-test-simulator.sh)"
          echo "DESTINATION=platform=iOS Simulator,id=${udid}" >> "$GITHUB_ENV"

      - name: Setup dummy config
        run: |
          cd install && bash install.sh

      - name: Install toolchain (tuist via mise)
        run: |
          mise install
          echo "$(mise where tuist)" >> "$GITHUB_PATH"

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            Tuist/.build
            ~/Library/Caches/tuist
          key: spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-

      - name: Install dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      - name: Reset DerivedData
        run: |
          set -euo pipefail
          rm -rf ./DerivedData

      - name: Test schemes
        env:
          SCHEMES: ${{ needs.detect-changes.outputs.schemes }}
        run: |
          set -euo pipefail
          for scheme in $SCHEMES; do
            echo "::group::${scheme}"
            xcodebuild test \
              -workspace TodoCalendar.xcworkspace \
              -scheme "$scheme" \
              -derivedDataPath ./DerivedData \
              -destination "$DESTINATION" \
              -testLanguage en -testRegion en_US \
              | xcpretty
            echo "::endgroup::"
          done
